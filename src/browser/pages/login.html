<!doctype html>
<html lang="zh-Hans" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="style-src 'self'; script-src 'self' 'unsafe-inline'; manifest-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#181818" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Code-Tomoshibi</title>
    <link rel="icon" href="{{CS_STATIC_BASE}}/src/browser/media/favicon-dark-support.svg" />
    <link rel="alternate icon" href="{{CS_STATIC_BASE}}/src/browser/media/favicon.ico" />
    <link rel="manifest" href="{{BASE}}/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="192x192" href="{{CS_STATIC_BASE}}/src/browser/media/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="{{CS_STATIC_BASE}}/src/browser/media/pwa-icon-512.png" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/login.css" rel="stylesheet" />

    <!-- 这里曾经预取 workbench.js / workbench.css，但工作台真正请求的是
         base + "/stable-<vscode commit>/static/out/..." 再加 "?tomoshibi-native-ui=25"。
         登录页只有 BASE 和 CS_STATIC_BASE 两个模板变量（见 src/node/http.ts 的
         replaceTemplates），既拿不到 vscode product.json 的 commit，也拿不到那个查询串
         （写死在 lib/vscode 的 workbench.html 里），拼不出同一个缓存键，预取的 9.9MB
         一个字节都用不上，因此整段去掉。要恢复预取必须先新增模板变量。 -->
    <meta id="coder-options" data-settings="{{OPTIONS}}" />
  </head>
  <body>
    <div class="workbench-preview" aria-hidden="true">
      <div class="preview-rail"></div>
      <div class="preview-top"></div>
      <div class="preview-sessions"><i></i><i></i><i></i><i></i></div>
      <div class="preview-terminal"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="preview-status"></div>
    </div>
    <div class="privacy-blur" aria-hidden="true"></div>

    <main class="gate">
      <form class="gate-form" id="gate-form" method="post" novalidate>
        <input class="user-field" type="text" autocomplete="username" tabindex="-1" aria-hidden="true" />
        <input id="base" type="hidden" name="base" value="{{BASE}}" />
        <input id="href" type="hidden" name="href" value="" />

        <div class="code-entry" id="code-entry">
          <input
            class="code-input"
            id="code-input"
            type="text"
            name="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            autocomplete="one-time-code"
            autocapitalize="off"
            spellcheck="false"
            aria-label="六位数字密码"
            aria-describedby="gate-status"
            autofocus
            required
          />
          <div class="slots" aria-hidden="true">
            <span class="slot"></span><span class="slot"></span><span class="slot"></span> <span class="slot"></span
            ><span class="slot"></span><span class="slot"></span>
          </div>
        </div>

        <button class="fallback-submit" type="submit">进入</button>
        <p class="status" id="gate-status" role="status" aria-live="polite"></p>
        {{ERROR}}
      </form>
    </main>

    <script>
      ;(function () {
        "use strict"

        var CODE_LENGTH = 6
        var html = document.documentElement
        var form = document.getElementById("gate-form")
        var input = document.getElementById("code-input")
        var entry = document.getElementById("code-entry")
        var status = document.getElementById("gate-status")
        var href = document.getElementById("href")
        var slots = Array.prototype.slice.call(document.querySelectorAll(".slot"))
        var submitting = false

        html.classList.remove("no-js")
        if (href) href.value = location.href

        function focusInput() {
          try {
            input.focus({ preventScroll: true })
          } catch (error) {
            input.focus()
          }
        }

        function render() {
          var length = input.value.length
          slots.forEach(function (slot, index) {
            slot.textContent = index < length ? "•" : ""
            slot.classList.toggle("is-filled", index < length)
            slot.classList.toggle("is-current", !submitting && document.activeElement === input && index === length)
          })
        }

        function fail(message) {
          submitting = false
          input.disabled = false
          input.value = ""
          entry.classList.remove("is-submitting")
          entry.classList.add("is-error")
          status.textContent = message
          render()
          window.setTimeout(function () {
            entry.classList.remove("is-error")
            focusInput()
            render()
          }, 420)
        }

        function submitCode() {
          if (submitting || input.value.length !== CODE_LENGTH) return
          submitting = true
          input.disabled = true
          status.textContent = ""
          entry.classList.add("is-submitting")
          render()

          var body = new URLSearchParams()
          body.set("password", input.value)
          body.set("base", document.getElementById("base").value)
          body.set("href", href ? href.value : location.href)

          fetch(location.href, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: body.toString(),
          })
            .then(function (response) {
              if (!response.redirected) {
                fail("密码错误")
                return
              }
              document.body.classList.add("is-opening")
              window.setTimeout(function () {
                location.assign(response.url)
              }, 260)
            })
            .catch(function () {
              fail("连接失败，请重试")
            })
        }

        input.addEventListener("input", function () {
          input.value = input.value.replace(/\D/g, "").slice(0, CODE_LENGTH)
          status.textContent = ""
          render()
          submitCode()
        })
        input.addEventListener("focus", render)
        input.addEventListener("blur", render)
        entry.addEventListener("pointerdown", function () {
          if (!submitting) focusInput()
        })
        form.addEventListener("submit", function (event) {
          if (!html.classList.contains("no-js")) {
            event.preventDefault()
            submitCode()
          }
        })
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !submitting) {
            focusInput()
            render()
          }
        })

        render()
        window.requestAnimationFrame(function () {
          document.body.classList.add("is-ready")
        })
      })()
    </script>
  </body>
</html>
