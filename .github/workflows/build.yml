# Code-Tomoshibi: build the linux-x64 release tarball on a GitHub-hosted runner.
# The build itself is unchanged (ci/build/*.sh); this file only provides the
# environment those scripts expect. ci/build/build-vscode.sh refuses to run
# outside a dedicated, memory-limited cgroup named *tomoshibi-code-build* with
# at least 12 GiB of RAM, so the VS Code step runs inside a transient systemd
# scope that satisfies that guard.
name: build-linux-x64

on:
  push:
    branches: [main]
    # 纯文档 / 截图改动不值得跑一次 8 分钟的全量编译
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  VERSION: 4.132.0-tomoshibi.2
  VSCODE_TARGET: linux-x64
  DISABLE_V8_COMPILE_CACHE: "1"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 快照仓每次 push 都是全量重建，跑到一半的旧构建没有保留价值。
# 不加这段的话连推几个 commit 会并排跑几个 240 分钟上限的构建，
# 而且先推的可能后完成，Actions 页上「最新一次成功」会指向旧 commit。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Runner facts
        run: |
          nproc
          free -g
          df -h /
          cat /proc/self/cgroup
          stat -fc %T /sys/fs/cgroup

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev libx11-dev pkg-config

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lib/vscode/package-lock.json

      - name: Install code-server deps
        run: SKIP_SUBMODULE_DEPS=1 npm ci

      - name: Build code-server (tsc)
        run: npm run build

      - name: Install VS Code deps
        working-directory: lib/vscode
        run: npm ci

      - name: Build VS Code (inside memory-limited scope)
        run: |
          sudo systemd-run --scope --quiet \
            --unit=tomoshibi-code-build \
            --description="Code-Tomoshibi VS Code build" \
            -p MemoryMax=12G \
            -- runuser -u "$USER" -- env \
              PATH="$PATH" HOME="$HOME" \
              VERSION="$VERSION" VSCODE_TARGET="$VSCODE_TARGET" \
              TOMOSHIBI_ISOLATED_BUILD=1 \
              DISABLE_V8_COMPILE_CACHE=1 ELECTRON_SKIP_BINARY_DOWNLOAD=1 \
              GITHUB_TOKEN="$GITHUB_TOKEN" \
              bash -c "cd '$PWD' && npm run build:vscode"

      - name: Release
        run: npm run release

      - name: Pack
        run: |
          # env.VERSION 是版本号的唯一真值，产物里的版本是它一路经 product.json
          # 传下来的结果。这里回头对一次，免得改了一处忘了另一处还照样出包。
          built_version=$(jq -r .version release/package.json)
          if [[ "$built_version" != "$VERSION" ]]; then
            echo "产物版本 $built_version 与 workflow 里的 VERSION=$VERSION 对不上"
            exit 1
          fi
          echo "release version: $built_version"
          tar -C release -czf "codet-${GITHUB_SHA:0:11}.tar.gz" .
          ls -la codet-*.tar.gz
          echo "product.json commit: $(grep -o '"commit": *"[^"]*"' release/lib/vscode/product.json | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: codet-release
          path: codet-*.tar.gz
          retention-days: 14
          compression-level: 0

      # 上面那份是 KEEP_MODULES=0 的「只有 JS」包：没有 bin/code-server、没有 lib/node、
      # 三处 node_modules 全被剥掉，只能叠在一份现成 runtime 上跑。下面再出一份完整包，
      # 让「从零造出一份能跑的 runtime」这件事有 CI 兜底，而不是只存在于一份手工构建的 tar.gz 里。
      - name: Release (full runtime)
        run: |
          # 上一次 release 把根目录的 npm-shrinkwrap.json 搬走了，remote/ 与 extensions/
          # 下的那两份则留在原地；先清掉，让 create_shrinkwraps 从 package-lock 重新生成。
          rm -f npm-shrinkwrap.json \
            lib/vscode/remote/npm-shrinkwrap.json \
            lib/vscode/extensions/npm-shrinkwrap.json
          KEEP_MODULES=1 RELEASE_PATH=release-full npm run release

      - name: Pack full runtime
        run: |
          test -x release-full/bin/code-server
          test -f release-full/lib/node
          test -d release-full/node_modules
          tar -C release-full -czf "code-tomoshibi-$VERSION-linux-amd64.tar.gz" .
          ls -la code-tomoshibi-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: codet-runtime-full
          path: code-tomoshibi-*-linux-amd64.tar.gz
          retention-days: 7
          compression-level: 0
